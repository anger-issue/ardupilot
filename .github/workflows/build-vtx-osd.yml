name: Build TBS Lucid H7 VTX OSD

on:
  push:
    branches:
      - vtx-band-channel
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout ArduPilot
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git python3 python3-pip python3-dev \
            python3-setuptools python3-wheel \
            build-essential g++ make ccache \
            gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            libtool pkg-config genromfs

      - name: Configure firmware
        run: |
          ./waf configure --board TBS_LUCID_H7

      - name: Compile ArduCopter
        run: |
          ./waf copter -j2

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: TBS_LUCID_H7_VTX_OSD
          path: build/TBS_LUCID_H7/bin/*.apj
          if-no-files-found: error
