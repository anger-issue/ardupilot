name: Build TBS Lucid H7 VTX OSD

on:
  push:
    branches:
      - vtx-osd-final-test
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout ArduPilot
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3-pip python3-dev \
            gcc-arm-none-eabi \
            libxml2-dev libxslt1-dev

          python3 -m pip install --user empy==3.3.4 lxml

      - name: Configure TBS Lucid H7
        run: ./waf configure --board TBS_LUCID_H7

      - name: Compile ArduCopter
        run: ./waf copter -j2

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: TBS_LUCID_H7-VTX-OSD
          path: build/TBS_LUCID_H7/bin/
